name: Sync Kaohsiung YouBike Snapshot

on:
  schedule:
    # Run every 15 minutes
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-snapshot:
    # DISABLED: KCG API blocks all overseas IPs (GitHub Actions / Vercel).
    # Re-enable by removing the if: false line below once a viable data source is found.
    if: false
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch Latest Kaohsiung YouBike Data via TDX API
        env:
          # TDX (交通部) API credentials — globally accessible, no IP restrictions
          # Register free account at: https://tdx.transportdata.tw/
          # Add Client ID and Secret in: GitHub repo → Settings → Secrets → Actions
          TDX_CLIENT_ID: ${{ secrets.TDX_CLIENT_ID }}
          TDX_CLIENT_SECRET: ${{ secrets.TDX_CLIENT_SECRET }}
        run: |
          node scripts/update-kcg-snapshot.js

      - name: Commit and Push Updated Snapshot
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chrono: update Kaohsiung YouBike static snapshot [skip ci]"
          file_pattern: "public/kcg-youbike-snapshot.json"
